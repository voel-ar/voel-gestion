<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOËL Gestión</title>
<meta name="theme-color" content="#2E5E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VOËL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: menú lateral fijo (compu) + contenido + columna derecha de pendientes y alertas (pantallas anchas); en celular, cajón de menú, barra inferior con botón central «Cargar» y pendientes arriba del panel. Identidad de la tienda: Tenor Sans + Inter, blanco/negro con verde VOËL. */
:root{
  --paper:#F3F5F3; --surface:#FFFFFF; --ink:#151917; --ink2:#38403B; --muted:#5F6862; --line:#DCE1DD; --soft:#ECF0ED;
  --accent:#2E5E3A; --accent-ink:#FFFFFF; --accent-soft:#DCE9DF; --ref:#A2ABA5; --taupe:#8B7D6B;
  --ok:#2C7A4B; --ok-soft:#DDF0E3; --warn:#94600F; --warn-soft:#F6EAD3; --bad:#B3261E; --bad-soft:#F8DEDB;
  --scrim:rgba(12,16,14,.45);
  --display:"Tenor Sans","Didot","Bodoni 72",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1210; --surface:#161B18; --ink:#E7ECE8; --ink2:#C3CBC6; --muted:#97A29B; --line:#29312C; --soft:#1E2521;
  --accent:#78BE8C; --accent-ink:#0C1A10; --accent-soft:#1B3123; --ref:#5E6862; --taupe:#B5A792;
  --ok:#6FCB93; --ok-soft:#173023; --warn:#E7B35E; --warn-soft:#3A2B12; --bad:#F08B83; --bad-soft:#3D1A17;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1210; --surface:#161B18; --ink:#E7ECE8; --ink2:#C3CBC6; --muted:#97A29B; --line:#29312C; --soft:#1E2521;
  --accent:#78BE8C; --accent-ink:#0C1A10; --accent-soft:#1B3123; --ref:#5E6862; --taupe:#B5A792;
  --ok:#6FCB93; --ok-soft:#173023; --warn:#E7B35E; --warn-soft:#3A2B12; --bad:#F08B83; --bad-soft:#3D1A17;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.amt,.mono{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* estructura */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.maincol{min-width:0;display:flex;flex-direction:column}
.side{position:fixed;z-index:45;top:0;bottom:0;left:0;width:min(86vw,300px);background:var(--surface);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#scrim{position:fixed;inset:0;z-index:44;background:var(--scrim)}
.rail{display:none}
@media (min-width:900px){
  .app{grid-template-columns:244px minmax(0,1fr)}
  .side{position:sticky;transform:none;width:auto;height:100vh;box-shadow:none;padding:22px 14px 16px max(14px,env(safe-area-inset-left,0px))}
  #scrim{display:none}
}
@media (min-width:1280px){
  .app{grid-template-columns:244px minmax(0,1fr) 320px}
  .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;border-left:1px solid var(--line);background:var(--surface);padding:22px max(18px,env(safe-area-inset-right,0px)) 22px 18px}
  .pend-inline{display:none!important}
}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 10px 18px}
.brand b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.2em;line-height:1}
.brand span{font-size:10.5px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted)}
.navg{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.navg h6{margin:0 0 4px;padding:0 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.navi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--ink2);cursor:pointer;text-align:left}
.navi:hover{background:var(--soft)}
.navi.act{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navi .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid var(--line)}
.who img{width:32px;height:32px;border-radius:50%;flex:0 0 auto}
.who div{min-width:0;display:flex;flex-direction:column}
.who b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:12px;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
@media (min-width:900px){header.top{background:var(--paper);border-bottom:0}}
.topin{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.topin{padding:18px 32px 6px}}
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.topbrand{font-family:var(--display);font-size:22px;letter-spacing:.18em}
.toptitle{display:none;min-width:0}
.toptitle small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.toptitle b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){.mob{display:none!important}.toptitle{display:block}}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted);display:none;align-items:center;gap:6px;white-space:nowrap}
@media (min-width:600px){.sync{display:flex}}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill .n{background:var(--warn);color:var(--surface);border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
@media (min-width:1280px){.pill.pendbtn{display:none}}
@media (max-width:599px){.pill.pendbtn .lbl{display:none}}

main{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding:10px 32px 48px}}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){nav.bot{display:none}}
nav.bot .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bot button{background:none;border:0;padding:5px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
nav.bot button svg{width:22px;height:22px}
nav.bot button.act{color:var(--accent);font-weight:600}
nav.bot button.plus span.c{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 6px 16px rgba(0,0,0,.18)}

/* piezas */
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:600;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .p0{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px) and (max-width:899px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.kpi strong{display:block;font-size:clamp(17px,4.6vw,23px);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead label,.kpi.lead small{color:var(--accent-ink);opacity:.8}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:13px 20px;font-size:15.5px;width:100%;justify-content:center}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;max-width:100%}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--soft);cursor:pointer;background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.item .a{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .c{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--paper)}
tr.sec td{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;background:var(--soft);white-space:normal}
tr.tot td{font-weight:700}
tr.closed td{color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.kvt td:first-child{white-space:normal} .kvt td:last-child{width:1%}
.neg{color:var(--bad)} .est{font-style:italic;color:var(--warn)}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:0;border-bottom:1px solid var(--soft);font-size:13.5px;background:none;text-align:left;width:100%;cursor:pointer}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.ok{background:var(--ok)}
.banner{padding:11px 14px;border-radius:var(--r);font-size:13.5px;background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.back{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13.5px}
input.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
/* pendientes */
.pend{display:flex;flex-direction:column}
.pend-it{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:11px 0;border-bottom:1px solid var(--soft)}
.pend-it:last-child{border-bottom:0}
.pend-it b{font-size:13.5px} .pend-it span{font-size:12.5px;color:var(--muted)}
.pend-act{display:flex;gap:2px 4px;flex-wrap:wrap;align-items:center}
.pend-act .btn.ghost{padding:5px 8px;color:var(--muted)}
.pend-inline .pscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pend-inline .pcard{flex:0 0 250px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.pend-inline .pcard b{font-size:13.5px} .pend-inline .pcard span{font-size:12px;color:var(--muted);flex:1}
.rail h2{margin-bottom:4px}
.rail .list{border-radius:10px}
/* producción */
.prog{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ord:last-child{border-bottom:0}.ord:hover{background:var(--soft)}
.ord .prog{grid-column:1/-1}
.ord .s{font-size:12.5px;color:var(--muted)}
/* acciones rápidas */
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.qa{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qa button{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.qa button:hover{border-color:var(--accent)}
.qa button .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qa button b{display:block;font-size:14px} .qa button span{display:block;font-size:12px;color:var(--muted)}
.act-it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft);font-size:13px}
.act-it:last-child{border-bottom:0}
.act-it img{width:28px;height:28px;border-radius:50%}
.act-it .tm{font-size:11.5px;color:var(--muted);white-space:nowrap}
/* gráficos */
.chart{width:100%;min-height:60px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-t{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .lab{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--sans)}
.chart .s-acc{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .s-ref{stroke:var(--ref);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .a-acc{fill:var(--accent);opacity:.1}
.chart .b-acc{fill:var(--accent)}
.chart .b-acc.dim{opacity:.45}
.chart .d-acc{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .d-ref{fill:var(--ref);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .b-acc,.chart g.bar:hover .b-acc{opacity:.8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-right:5px}
.hb{display:grid;grid-template-columns:minmax(80px,32%) minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13px}
.hb .l{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:14px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
details.dv{margin-top:10px;font-size:12.5px}
details.dv summary{cursor:pointer;color:var(--muted);font-weight:600}
details.dv .tbl{margin-top:8px;max-height:260px;overflow:auto}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:240px}
#tip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
#tip .k{display:inline-block;width:12px;height:2px;border-radius:2px;vertical-align:middle;margin-right:6px}
#tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
/* formulario */
#sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .panel.wide{max-width:900px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const toISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>toISO(new Date());
const D=iso=>{const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d,12)};
const addD=(iso,n)=>{const d=D(iso);d.setDate(d.getDate()+n);return toISO(d)};
const diffD=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fd=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"—";
const fdShort=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7):"—";
const mk=iso=>iso?iso.slice(0,7):"";
const mStart=k=>k+"-01";
const mEnd=k=>{const[y,m]=k.split("-").map(Number);return k+"-"+pad(new Date(y,m,0).getDate())};
const mAdd=(k,n)=>{let[y,m]=k.split("-").map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12+1;return y+"-"+pad(m)};
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mName=k=>k?MESES[+k.slice(5)-1]+" "+k.slice(0,4):"—";
const mShort=k=>k?MESES[+k.slice(5)-1].slice(0,3)+" "+k.slice(2,4):"—";
const DOW=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const dow=iso=>D(iso).getDay();
const n=x=>typeof x==="number"&&isFinite(x)?x:0;
const has=x=>typeof x==="number"&&isFinite(x);
const sum=(a,f)=>a.reduce((s,x)=>s+n(f(x)),0);
const m$=x=>has(x)?(x<0?"-":"")+"$\u00a0"+Math.round(Math.abs(x)).toLocaleString("es-AR"):"—";
const c$=x=>{if(!has(x))return"—";const a=Math.abs(x),s=x<0?"-":"";if(a>=1e6)return s+"$\u00a0"+(a/1e6).toLocaleString("es-AR",{maximumFractionDigits:a>=1e7?1:2})+"\u00a0M";if(a>=1e3)return s+"$\u00a0"+Math.round(a/1e3).toLocaleString("es-AR")+"\u00a0k";return s+"$\u00a0"+Math.round(a)};
const pctF=x=>has(x)?(x*100).toLocaleString("es-AR",{maximumFractionDigits:1})+"%":"—";
const numF=x=>has(x)?x.toLocaleString("es-AR",{maximumFractionDigits:2}):"—";
const norm=s=>String(s??"").trim().toLowerCase();
const safeId=s=>String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").slice(0,180)||"x";
const nowISO=()=>new Date().toISOString();
function relTime(iso){if(!iso)return"";const s=(Date.now()-Date.parse(iso))/1000;if(s<60)return"recién";if(s<3600)return"hace "+Math.round(s/60)+" min";if(s<86400)return"hace "+Math.round(s/3600)+" h";const d=Math.round(s/86400);return d===1?"ayer":"hace "+d+" días"}
function parseMoney(s){
  if(s==null)return null; s=String(s).trim().toLowerCase(); if(!s)return null;
  let mult=1;
  if(/(millones|millón|millon|mill|m)$/.test(s)){mult=1e6;s=s.replace(/(millones|millón|millon|mill|m)$/,"")}
  else if(/(mil|k)$/.test(s)){mult=1e3;s=s.replace(/(mil|k)$/,"")}
  s=s.replace(/[$\s]/g,"").replace(/ars/g,"");
  const neg=s.startsWith("-"); s=s.replace(/^-/,"");
  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}
  else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)){s=s.replace(/\./g,"")}
  if(!/^\d*\.?\d+$/.test(s))return NaN;
  const v=parseFloat(s)*mult; return neg?-v:v;
}
function parseNum(s){if(s==null)return null;s=String(s).trim();if(!s)return null;s=s.replace(/\s/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=Number(s);return isFinite(v)?v:NaN}
function parseDate(s){
  s=String(s||"").trim(); let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s)))return valid(+m[1],+m[2],+m[3]);
  if((m=/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/.exec(s))){
    let y=m[3]?+m[3]:null; if(y!=null&&y<100)y+=2000;
    if(y==null){y=new Date().getFullYear();const iso=valid(y,+m[2],+m[1]);if(iso&&iso>addD(today(),60))y--}
    return valid(y,+m[2],+m[1]);
  }
  return null;
  function valid(y,mo,d){const dt=new Date(y,mo-1,d,12);return dt.getMonth()===mo-1&&dt.getDate()===d?toISO(dt):null}
}
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}

/* ---------- estado ---------- */
const COLS_SHARED=["ventas","gastos","proveedores","ingresos","talleres","ordenes","entregas"];
const COLS_OWNER=["compras","pagosProv","caja","personal","liquidaciones","pagosPers","articulos","ordenesValor","pagosTaller"];
const S={config:null,general:null};[...COLS_SHARED,...COLS_OWNER].forEach(c=>S[c]=[]);
const loaded={};
let db=null, USER=null, dbState="connecting", readOnly=false;
const ROLE={ready:false,owner:false,me:null,name:"",avatar:""};
const NAMES={}, AVA={}; let namesPending=new Set();
const UI={view:"panel",q:"",iMonth:null,vMonth:null,rPeriod:null,sMes:null,ordF:"abiertas",drawer:false};
try{const v=localStorage.getItem("voel.view");if(v)UI.view=v}catch(e){}
const cfg=()=>Object.assign({},S.config||{},S.general||{});
const fijos=()=>n(cfg().alquiler)+n(cfg().sueldos)+n(cfg().otrosFijos);
const margen=()=>has(cfg().margen)?cfg().margen:null;
const metaMes=()=>margen()?(fijos()+n(cfg().ganancia))/margen():null;
const equilibrio=()=>margen()?fijos()/margen():null;
const formalStart=()=>cfg().inicioFormal||"2026-11-01";
const pDesde=()=>cfg().pruebaDesde||"2026-10-24";
const pHasta=()=>cfg().pruebaHasta||"2026-10-31";
const isOwner=()=>ROLE.owner;
const canEditRec=r=>ROLE.owner||!r||(!!ROLE.me&&r.creadoPor===ROLE.me);
function who(id){if(!id)return{n:"Carga externa",a:""};if(id===ROLE.me)return{n:"Vos",a:ROLE.avatar};if(!(id in NAMES))namesPending.add(id);return{n:NAMES[id]||"Alguien del equipo",a:AVA[id]||""}}
async function flushNames(){if(!USER||!namesPending.size)return;const ids=[...namesPending];namesPending=new Set();ids.forEach(i=>NAMES[i]=NAMES[i]||"");
  try{const ps=await USER.profiles(ids);let ch=false;ids.forEach(i=>{const p=ps[i];if(p){if(p.name&&NAMES[i]!==p.name){NAMES[i]=p.name;ch=true}if(p.avatarUrl&&AVA[i]!==p.avatarUrl){AVA[i]=p.avatarUrl;ch=true}}});if(ch){render();const fa=document.getElementById("faudit");if(fa&&F&&F.rec)fa.innerHTML=auditHTML(F.rec)}}catch(e){}}

/* ---------- calendario ---------- */
function isOpen(iso){const c=cfg();if((c.cerrados||[]).includes(iso))return false;if(dow(iso)===0)return (c.domingos||[]).includes(iso);return true}
function openDays(a,b){let c=0;for(let d=a;d<=b;d=addD(d,1))if(isOpen(d))c++;return c}

/* ---------- cálculos ---------- */
const MED=["efectivo","transferencia","tarjeta","otros"];
const hasMed=v=>MED.some(k=>has(v[k]));
const cobrado=v=>hasMed(v)?sum(MED,k=>v[k]):null;
const ventaDe=iso=>S.ventas.find(v=>v.fecha===iso);
function ventaCtrl(v){
  if(v.fecha<pDesde())return["Fecha anterior a la prueba","warn"];
  if(!has(v.total))return["Falta total","bad"];
  if(dow(v.fecha)===0&&!isOpen(v.fecha))return["Domingo sin marcar apertura","warn"];
  if(!hasMed(v))return["Sin desglose de cobro",""];
  if(Math.round(v.total-cobrado(v))!==0)return["Venta ≠ cobro","warn"];
  return["OK","ok"];
}
function monthStats(k){
  const a=mStart(k),b=mEnd(k);
  const V=S.ventas.filter(v=>v.fecha>=a&&v.fecha<=b);
  const acum=sum(V,v=>v.total);
  const last=V.length?V.map(v=>v.fecha).sort().pop():null;
  const tot=openDays(a,b), trans=last?openDays(a,last):0, rest=tot-trans;
  const meta=k>=mk(formalStart())?metaMes():null;
  const falt=meta!=null?Math.max(0,meta-acum):null;
  const prom=trans>0?acum/trans:null;
  return{a,b,V,acum,last,tot,trans,rest,meta,falt,pct:meta?acum/meta:null,metaDia:meta&&tot?meta/tot:null,
    objRest:falt!=null&&rest>0?falt/rest:null,prom,proy:prom!=null?acum+prom*rest:null,dias:V.length,eq:equilibrio(),
    cobros:sum(V,cobrado)};
}
function calcArt(r){
  const usd=has(r.telaUsd)&&has(r.dolar)?r.telaUsd*r.dolar:null;
  const tp=r.moneda==="Pesos"?(has(r.telaPrecio)?r.telaPrecio:null):r.moneda==="Dólares"?usd:(has(r.telaPrecio)?r.telaPrecio:usd);
  const tTot=has(r.telaKg)&&tp!=null?r.telaKg*tp:null;
  const uso=has(r.uso)?r.uso:1;
  const tUsada=tTot!=null?tTot*uso:null;
  const rinde=has(r.rinde)?r.rinde:(has(r.capas)&&has(r.cuerpos)?r.capas*r.cuerpos:null);
  const tela=tUsada!=null&&rinde?tUsada/rinde:null;
  const ojal=has(r.ojalCant)?r.ojalCant*n(r.ojalPrecio):(has(r.ojalPrecio)?r.ojalPrecio:null);
  const bot=has(r.botonesCant)?r.botonesCant*n(r.botonesPrecio):(has(r.botonesPrecio)?r.botonesPrecio:null);
  const costo=n(tela)+n(r.taller)+n(r.fabrica)+n(r.marketing)+n(r.elastico)+n(ojal)+n(bot)+n(r.accesorios)+n(r.otros);
  const m=margen();
  const sugRec=has(r.recargo)&&costo>0?costo*(1+r.recargo):null;
  const sug=costo>0&&has(m)&&m<1?costo/(1-m):null;
  const gan=has(r.precio)?r.precio-costo:null;
  const mv=has(r.precio)&&r.precio!==0?gan/r.precio:null;
  const recMv=has(r.recargo)?r.recargo/(1+r.recargo):null;
  let ctrl="OK";
  if(!r.estado)ctrl="Indicá Real o Estimado";else if(tela==null)ctrl="Falta completar la tela";else if(!has(r.taller))ctrl="Falta taller";else if(mv!=null&&has(m)&&mv<m)ctrl="Margen menor a "+pctF(m);
  const redondeo=sugRec!=null?Math.ceil(sugRec/500)*500:null;
  return{tp,tTot,uso,tUsada,rinde,tela,ojal,bot,costo,m,sugRec,sug,gan,mv,recMv,ctrl,redondeo};
}
const artTitle=r=>[r.codigo,r.modelo,r.tela].filter(Boolean).join(" · ")||"Artículo";
function calcCompra(c){
  const P=S.pagosProv.filter(p=>p.compraId===c.id);
  const pag=sum(P.filter(p=>p.tipo==="Pago"),p=>p.importe), nc=sum(P.filter(p=>p.tipo==="Nota de crédito"),p=>p.importe);
  const saldo=n(c.importe)-pag-nc;
  const t=today();
  const estado=saldo<=0?"Saldada":(c.vencimiento&&c.vencimiento<t?"Vencida":(pag+nc>0?"Parcial":"Pendiente"));
  const dias=c.vencimiento&&saldo>0?diffD(t,c.vencimiento):null;
  return{pag,nc,saldo,estado,dias,conf:c.esVoel==="Sí"};
}
function calcLiq(l){
  const gasto=n(l.base)+n(l.extras)-n(l.descuentos);
  const P=S.pagosPers.filter(p=>p.personaId===l.personaId&&p.periodo===l.periodo);
  const adel=sum(P.filter(p=>p.tipo==="Adelanto"),p=>p.importe), pag=sum(P.filter(p=>p.tipo==="Pago"),p=>p.importe);
  return{gasto,adel,pag,saldo:gasto-adel-pag};
}
function calcOrden(o){
  const E=S.entregas.filter(e=>e.ordenId===o.id);
  const esperadas=has(o.prendas)?o.prendas:(has(o.capas)&&has(o.cuerpos)?o.capas*o.cuerpos:null);
  const entregadas=sum(E,e=>e.cantidad), fallas=sum(E,e=>e.fallas), buenas=entregadas-fallas;
  const faltante=esperadas!=null?Math.max(0,esperadas-entregadas):null;
  const val=S.ordenesValor.find(x=>x.id===o.id)||{};
  const precio=has(val.precioTaller)?val.precioTaller:null;
  const aPagar=precio!=null?buenas*precio:null;
  const pagado=sum(S.pagosTaller.filter(p=>p.ordenId===o.id),p=>p.importe);
  const t=today(), cerrada=o.estado==="Cerrada";
  let estado,cl;
  if(cerrada){estado=faltante>0?"Cerrada con faltante":"Cerrada";cl=faltante>0?"warn":""}
  else if(esperadas!=null&&entregadas>=esperadas){estado="Completa";cl="ok"}
  else if(o.fechaPrometida&&o.fechaPrometida<t){estado="Atrasada";cl="bad"}
  else if(entregadas>0){estado="Entrega parcial";cl="warn"}
  else{estado="En taller";cl="acc"}
  const ultima=E.length?E.map(e=>e.fecha).sort().pop():null;
  const abierta=!cerrada&&!(esperadas!=null&&entregadas>=esperadas);
  return{E,esperadas,entregadas,fallas,buenas,faltante,precio,aPagar,pagado,estado,cl,ultima,abierta,pct:esperadas?Math.min(1,entregadas/esperadas):0};
}
function calcTaller(t){
  const O=S.ordenes.filter(o=>o.tallerId===t.id).map(o=>({o,k:calcOrden(o)}));
  const aPagar=sum(O,x=>x.k.aPagar), pagos=sum(S.pagosTaller.filter(p=>p.tallerId===t.id),p=>p.importe);
  return{O,abiertas:O.filter(x=>x.k.abierta).length,enTaller:sum(O.filter(x=>x.k.abierta),x=>x.k.faltante),aPagar,pagos,saldo:aPagar-pagos};
}
const mesGasto=g=>g.periodo||mk(g.fecha);
const provName=id=>(S.proveedores.find(p=>p.id===id)||{}).nombre||"Proveedor sin cargar";
const persName=id=>(S.personal.find(p=>p.id===id)||{}).nombre||"Persona sin cargar";
const tallerName=id=>(S.talleres.find(p=>p.id===id)||{}).nombre||"Taller sin cargar";
const ordenLabel=o=>o?o.id+" · "+(o.modelo||"")+" · "+tallerName(o.tallerId):"Orden inexistente";

function periods(){
  const L=[{key:"prueba",label:"Prueba",short:"Prueba",desde:pDesde(),hasta:pHasta(),formal:false}];
  const s=mk(formalStart()); let end=mAdd(s,11); if(mk(today())>end)end=mk(today());
  for(let k=s;k<=end;k=mAdd(k,1))L.push({key:k,label:mName(k),short:mShort(k),desde:mStart(k),hasta:mEnd(k),formal:true});
  return L;
}
function resumen(p){
  const c=cfg(), t=today(), inR=iso=>iso&&iso>=p.desde&&iso<=p.hasta;
  const V=S.ventas.filter(v=>inR(v.fecha));
  const ventas=sum(V,v=>v.total), cobros=sum(V,cobrado);

function situacion(){
  const t=today(), C=S.compras.map(c=>({c,k:calcCompra(c)}));
  const conf=C.filter(x=>x.k.conf);

    vencido:sum(conf.filter(x=>x.k.estado==="Vencida"),x=>x.k.saldo),vencidoN:conf.filter(x=>x.k.estado==="Vencida").length,
    v7:sum(conf.filter(x=>x.k.saldo>0&&x.c.vencimiento>=t&&x.c.vencimiento<=addD(t,7)),x=>x.k.saldo),
    v30:sum(conf.filter(x=>x.k.saldo>0&&x.c.vencimiento>=t&&x.c.vencimiento<=addD(t,30)),x=>x.k.saldo),
    gastosPend:sum(S.gastos.filter(g=>g.estado!=="Pagado"),g=>g.importe),

    gastos7:sum(S.gastos.filter(g=>g.estado!=="Pagado"&&g.vencimiento>=t&&g.vencimiento<=addD(t,7)),g=>g.importe),
    personal:sum(S.liquidaciones,l=>Math.max(0,calcLiq(l).saldo)),
    talleres:sum(S.talleres,tl=>Math.max(0,calcTaller(tl).saldo))};
  const venc=[];
  conf.filter(x=>x.k.saldo>0&&x.c.vencimiento&&x.c.vencimiento>=t).forEach(x=>venc.push({f:x.c.vencimiento,t:provName(x.c.proveedorId),s:x.c.id+(x.c.comprobante?" · "+x.c.comprobante:""),v:x.k.saldo,go:["compras",x.c.id]}));

  r.prox=venc.sort((a,b)=>a.f.localeCompare(b.f)).slice(0,6);

    r.disp=sum(sal,k=>c[k])+sum(S.ventas.filter(v=>af(v.fecha)),cobrado)
      +sum(S.caja.filter(x=>af(x.fecha)&&x.tipo==="Ingreso"),x=>x.importe)-sum(S.caja.filter(x=>af(x.fecha)&&x.tipo==="Egreso"),x=>x.importe)
      -sum(S.pagosProv.filter(x=>af(x.fecha)&&x.tipo==="Pago"),x=>x.importe)-sum(S.gastos.filter(x=>x.estado==="Pagado"&&af(x.fechaPago)),x=>x.importe)
      -sum(S.pagosPers.filter(x=>af(x.fecha)),x=>x.importe)-sum(S.pagosTaller.filter(x=>af(x.fecha)),x=>x.importe);}
  return r;
}

function pendientesAll(){
  const c=cfg(),P=[];
  if(!S.personal.length)P.push(["personal","Personal","Personas, modalidad e importes","m:personal"]);
  if(!S.talleres.length)P.push(["talleres","Talleres","Quiénes cosen y sus datos","m:talleres"]);
  if(!S.proveedores.length)P.push(["proveedores","Proveedores","Quiénes son y datos de contacto","m:proveedores"]);
  if(!S.compras.some(x=>x.tipo==="Deuda inicial"))P.push(["deudas","Deudas iniciales","Saldos con proveedores al empezar","m:compras"]);
  if(!has(c.otrosFijos))P.push(["otros","Otros gastos fijos","Impuestos, intereses, servicios","ajustes"]);
  if(!c.saldosFecha||!["saldoEfectivo","saldoBancos","saldoBilleteras"].some(k=>has(c[k])))P.push(["saldos","Saldos iniciales","Caja, bancos y billeteras","ajustes"]);
  if(!has(c.stockInicial))P.push(["stock","Stock inicial","Valorizado al costo","ajustes"]);
  if(!S.articulos.length)P.push(["costos","Costos de productos","Artículos con su costo","m:articulos"]);
  return P;
}
function pendientes(){if(!ROLE.owner)return[];const o=cfg().pendOcultos||{},t=today();return pendientesAll().filter(p=>{const v=o[p[0]];return !(v==="no"||(v&&v>=t))})}
function alerts(){
  const A=[],t=today();
  S.ordenes.forEach(o=>{const k=calcOrden(o);if(k.estado==="Atrasada")A.push(["bad",o.id+" atrasada · "+tallerName(o.tallerId)+" · faltan "+numF(k.faltante),"m:ordenes"])});
  const dom=S.ventas.filter(v=>dow(v.fecha)===0&&!isOpen(v.fecha));
  if(dom.length)A.push(["warn",dom.length+" venta"+(dom.length>1?"s":"")+" en domingo sin marcar apertura","ventas"]);
  if(ROLE.owner){

const CH={}, CHD={};
function niceStep(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function yScale(maxV,ticks=4){const step=niceStep((maxV||1)/ticks);const max=Math.max(step,step*Math.ceil((maxV||1)/step));const T=[];for(let v=0;v<=max+1e-9;v+=step)T.push(v);return{max,T}}
function drawCharts(){document.querySelectorAll(".chart[data-ch]").forEach(el=>{const f=CH[el.dataset.ch];if(f){const w=Math.max(260,Math.floor(el.clientWidth||600));el.innerHTML=f(w)}})}
function dataTable(head,rows){return `<details class="dv"><summary>Ver datos</summary><div class="tbl"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`}
function lineChart(id,w,days,series){
  const h=w<480?200:230, pl=54, pr=14, pt=22, pb=24, pw=w-pl-pr, ph=h-pt-pb, N=days.length;
  const all=series.flatMap(s=>s.vals.filter(has)); if(!all.length&&!series.some(s=>s.vals.some(has)))return `<p class="small muted p0" style="padding:24px 0">Sin datos para graficar.</p>`;
  const {max,T}=yScale(Math.max(...all,1));
  const X=i=>pl+(N>1?i*pw/(N-1):pw/2), Y=v=>pt+ph-(v/max)*ph;
  let g=T.map(v=>`<line class="grid-l" x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis-t" x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${esc(c$(v).replace("$\u00a0",""))}</text>`).join("");
  const xt=[0,7,14,21,N-1].filter((x,i,a)=>x<N&&a.indexOf(x)===i);
  g+=xt.map(i=>`<text class="axis-t" x="${X(i)}" y="${h-6}" text-anchor="middle">${+days[i].slice(8)}</text>`).join("");
  const ends=[];
  series.forEach(s=>{
    let d="",start=null,last=null;s.vals.forEach((v,i)=>{if(!has(v))return;d+=(d?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);if(start==null)start=i;last=i});
    if(!d)return;
    if(s.area)g+=`<path class="a-${s.cls}" d="${d}L${X(last).toFixed(1)} ${Y(0)}L${X(start).toFixed(1)} ${Y(0)}Z"/>`;
    g+=`<path class="s-${s.cls}" d="${d}"/>`;
    g+=`<circle class="d-${s.cls}" cx="${X(last)}" cy="${Y(s.vals[last])}" r="4.5"/>`;
    ends.push({x:X(last),y:Y(s.vals[last]),t:c$(s.vals[last])});
  });
  if(ends.length===2&&Math.abs(ends[0].y-ends[1].y)<16){if(ends[0].y<=ends[1].y)ends[1].y+=16;else ends[0].y+=16}
  ends.forEach(e=>{const right=e.x>w-90;g+=`<text class="lab" x="${right?e.x-8:e.x+8}" y="${e.y-9}" text-anchor="${right?"end":"start"}">${esc(e.t)}</text>`});
  CHD[id]={pl,pw,N,days,series,X,Y,pt,ph};
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Gráfico de líneas">${g}
   <line class="xh" id="${id}-xh" x1="0" x2="0" y1="${pt}" y2="${pt+ph}" visibility="hidden"/>
   <rect class="hit" data-lc="${id}" x="${pl}" y="${pt}" width="${pw}" height="${ph}"/></svg>`;
}
function colChart(id,w,items,o={}){

  if(!N)return `<p class="small muted p0">Sin datos.</p>`;
  const vmax=Math.max(...items.map(x=>n(x.value)),o.ref&&items.some(x=>x.value)?o.ref:0,1);
  const {max,T}=yScale(vmax);

  let g=T.map(v=>`<line class="grid-l" x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis-t" x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${esc(c$(v).replace("$\u00a0",""))}</text>`).join("");
  const every=Math.max(1,Math.ceil(N*30/pw));
  items.forEach((it,i)=>{
    const cx=pl+band*i+band/2, v=n(it.value), y=Y(v), x=cx-bw/2, bh=Y(0)-y, r=Math.min(4,bh,bw/2);
    const path=bh>0?`M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${Y(0)}Z`:"";
    const tip=`<span>${esc(it.tip||it.label)}</span><b>${esc(m$(v))}</b>`;
    g+=`<g class="bar">${path?`<path class="b-acc ${it.dim?"dim":""}" d="${path}"/>`:""}<rect class="hit" x="${pl+band*i}" y="${pt}" width="${band}" height="${ph}" data-tip="${esc(tip)}" tabindex="0" aria-label="${esc((it.tip||it.label)+": "+m$(v))}"/></g>`;
    if(i%every===0||i===N-1&&N<=12)g+=`<text class="axis-t" x="${cx}" y="${h-6}" text-anchor="middle">${esc(it.label)}</text>`;
    if(o.labels==="all"&&v>0)g+=`<text class="lab" x="${cx}" y="${y-6}" text-anchor="middle">${esc(c$(v))}</text>`;

  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Gráfico de columnas">${g}</svg>`;
}

function parseBulk(){
  const txt=($("#bulk-in")||{}).value||"", rep=($("#bulk-rep")||{}).checked;
  const seen=new Set(), out=[];
  txt.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim())return;
    let cells=/\t|;|\|/.test(line)?line.split(/\t|;|\|/):line.trim().split(/\s+/);
    if(!/\t|;|\|/.test(line)){const M=[];cells.forEach(c=>{if(/^(mil|k|m|millones|millón|millon)$/i.test(c)&&M.length)M[M.length-1]+=" "+c;else M.push(c)});cells=M}
    cells=cells.map(c=>c.trim()).filter((c,j)=>c!==""||j>0);
    const d=parseDate(cells[0]);
    if(!d){if(i===0&&/fecha/i.test(line))return;out.push({line,err:"No entendí la fecha «"+(cells[0]||"")+"»"});return}
    const r={fecha:d,line};const keys=["total",...MED];
    for(let j=0;j<keys.length;j++){const raw=cells[j+1];if(raw==null||raw==="")continue;const v=parseMoney(raw);if(Number.isNaN(v)){r.err="No entendí «"+raw+"»";break}r[keys[j]]=v}
    if(!r.err&&!has(r.total))r.err="Falta el total";
    if(!r.err&&seen.has(d))r.err="Fecha repetida en lo pegado";
    if(!r.err&&d>today())r.err="Fecha futura ("+fd(d)+")";
    seen.add(d);
    if(!r.err){const ex=ventaDe(d);
      if(ex){if(!canEditRec(ex))r.skip="Ya la cargó otra persona";else if(!rep)r.skip="Ya cargado: se saltea";else r.status="Reemplaza"}
      else r.status="Nuevo";
      if(!r.skip&&hasMed(r)&&Math.round(r.total-cobrado(r))!==0)r.warn="Venta ≠ cobro";}
    out.push(r);
  });
  BULK=out;
  const ok=out.filter(r=>r.status), bad=out.filter(r=>r.err), skip=out.filter(r=>r.skip);
  $("#bulk-pv").innerHTML=out.length?`<div class="row" style="margin-bottom:8px"><span class="chip ok">${ok.length} para guardar</span>${skip.length?`<span class="chip">${skip.length} salteados</span>`:""}${bad.length?`<span class="chip bad">${bad.length} con error</span>`:""}<span class="chip acc">Total ${m$(sum(ok,r=>r.total))}</span></div>

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();return go(g.dataset.go)}
  const a=e.target.closest("[data-act]"); if(!a)return; const act=a.dataset.act;

  if(act==="logout"){if(window.VOEL_PLATFORM)window.VOEL_PLATFORM.logout();return}
  if(act==="drawer")return setDrawer(!UI.drawer);
  if(act==="quick")return openQuick();
  if(act==="qa")return quickGo(a.dataset.k);
  if(act==="openPend")return openPendSheet();
  if(act==="pendLater")return setPend(a.dataset.k,addD(today(),7));

  if(act==="pendReset"){if(ROLE.owner&&S.config)db.doc("config/main").update({pendOcultos:{}}).then(()=>toast("Pendientes restaurados"),()=>toast("No se pudo guardar."));return}
  if(act==="newVenta")return openVenta(today());
  if(act==="editVenta")return openVenta(a.dataset.d);
  if(act==="masiva")return openMasiva();
  if(act==="bulkSave")return saveBulk();
  if(act==="new")return openForm(a.dataset.m,null);
  if(act==="edit")return openForm(a.dataset.m,a.dataset.id);
  if(act==="sugg"){const el=document.getElementById("f-"+a.dataset.k);if(el&&a.dataset.v){el.value=numF(+a.dataset.v);livePreview()}return}
  if(act==="close")return closeSheet();
  if(act==="del")return deleteMod();
  if(act==="delVenta"){if(!ROLE.owner)return;if(!F.delArm){F.delArm=true;a.textContent="Tocá de nuevo para eliminar";return}delDoc("ventas",F.id).then(ok=>{if(ok){toast("Venta eliminada");closeSheet()}});return}
  if(act==="iMonth"){UI.iMonth=a.dataset.k;return render()}
  if(act==="vMonth"){UI.vMonth=a.dataset.k;return render()}
  if(act==="rPer"){UI.rPeriod=a.dataset.k;return render()}
  if(act==="ordF"){UI.ordF=a.dataset.k;return render()}
  if(act==="export")return exportar();
  if(act==="dlRep"){const p=periods().find(x=>x.key===a.dataset.k);if(p)dlReport(p,a.dataset.fmt);return}
  if(act==="dlSue"){const p=periods().find(x=>x.key===UI.sMes);if(p)dlReport(p,a.dataset.fmt,"sueldos");return}

document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target;
  if(!db||readOnly)return toast("No se puede guardar en esta vista.");
  if(f.dataset.form==="mod")submitMod(f);
  else if(f.dataset.form==="venta")submitVenta(f);
  else if(f.dataset.form==="cfg")saveCfg(f);

/* ---------- arranque ---------- */
render();
(async()=>{
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){dbState="off";ROLE.ready=true;return render()}
  try{USER=await claude.use("user")}catch(e){USER=null}
  let owner=false;
  if(USER){try{owner=await USER.isOwner()}catch(e){}try{const m=await USER.me();ROLE.me=m.id;ROLE.name=m.name||"";ROLE.avatar=m.avatarUrl||""}catch(e){}
    try{const c=await USER.can("data.write");if(c===false)readOnly=true}catch(e){}}
  if(!owner){try{const s=await db.doc("config/main").get();if(s.exists)owner=true}catch(e){}}
  ROLE.owner=owner; ROLE.ready=true; dbState="on";
  const onErr=e=>{console.error(e);if(e&&e.code==="revoked")dbState="off";render()};
  const docSub=(path,key)=>{loaded[key]=false;db.doc(path).onSnapshot(s=>{S[key]=s.exists?s.data():null;loaded[key]=true;
    if(key==="general"&&!s.exists&&ROLE.owner&&S.config){const g={};CAL_KEYS.forEach(k=>g[k]=S.config[k]??(k==="domingos"||k==="cerrados"?[]:null));db.doc("general/main").set(g).catch(()=>{})}
    render()},onErr)};
  const colSub=c=>{loaded[c]=false;db.collection(c).limit(1000).onSnapshot(s=>{S[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));loaded[c]=true;render()},onErr)};
  if(owner)docSub("config/main","config");
  docSub("general/main","general");
  COLS_SHARED.forEach(colSub);
  if(owner)COLS_OWNER.forEach(colSub);
  render();
})();
